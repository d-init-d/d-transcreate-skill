name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile scripts and tests
        run: python -m py_compile scripts/validate_pack.py scripts/build_adapters.py tests/test_pack.py
      - name: Validate source pack (release gate)
        run: python scripts/validate_pack.py . --release
      - name: Run test suite
        run: python tests/test_pack.py
      - name: Build and validate every adapter target
        run: |
          for platform in portable codex claude-code cursor opencode generic; do
            python scripts/build_adapters.py --platform "$platform" --dest "_tmp_build/$platform" --force
          done
      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match VERSION file ($version)" >&2
            exit 1
          fi
      - name: Package distribution tarball
        run: |
          git archive --format=tar.gz \
            --prefix="d-transcreate-skill-${GITHUB_REF_NAME}/" \
            -o "d-transcreate-skill-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=".github/releases/${tag}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$notes" \
              --verify-tag \
              "d-transcreate-skill-${tag}.tar.gz"
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              "d-transcreate-skill-${tag}.tar.gz"
          fi
