name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - VERSION
      - ".github/releases/**"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(cat VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
      - name: Byte-compile scripts and tests
        run: python -m py_compile scripts/validate_pack.py scripts/build_adapters.py tests/test_pack.py
      - name: Validate source pack (release gate)
        run: python scripts/validate_pack.py . --release
      - name: Run test suite
        run: python tests/test_pack.py
      - name: Build and validate every adapter target
        run: |
          for platform in portable codex claude-code cursor opencode generic; do
            python scripts/build_adapters.py --platform "$platform" --dest "_tmp_build/$platform" --force
          done
      - name: Verify tag matches VERSION
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="$(cat VERSION)"
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match VERSION file ($version)" >&2
            exit 1
          fi
      - name: Package distribution tarball
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          git archive --format=tar.gz \
            --prefix="d-transcreate-skill-${tag}/" \
            -o "d-transcreate-skill-${tag}.tar.gz" \
            HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          notes=".github/releases/${tag}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping create."
            exit 0
          fi
          args=(--title "$tag")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "${args[@]}" "d-transcreate-skill-${tag}.tar.gz"
